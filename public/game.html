<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Red Square Adventure</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1b2430;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 960px;
    height: 540px;
    max-width: 100%;
  }
  canvas {
    display: block;
    width: 960px;
    height: 540px;
    max-width: 100%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    image-rendering: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(10, 16, 24, .68);
    border-radius: 12px;
    color: #fff;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    margin: 0;
    font-size: 68px;
    letter-spacing: 2px;
    text-shadow: 0 6px 18px rgba(0,0,0,.6);
  }
  .overlay p { margin: 0; font-size: 18px; opacity: .85; }
  .overlay button {
    margin-top: 6px;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: #ffd34d;
    color: #22201a;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .overlay button:hover { filter: brightness(1.07); }
  #lose h1 { color: #ff6b5e; }
  #win h1 { color: #ffd34d; }
  #warn {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%) translateY(-14px);
    padding: 12px 26px;
    border-radius: 999px;
    background: rgba(255, 96, 78, .94);
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  #warn.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #controls {
    position: absolute;
    top: 60px;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  #controls button {
    width: 38px;
    height: 34px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(0,0,0,.35);
    color: #fff;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  #controls button:hover { background: rgba(0,0,0,.55); }
  #controls button.off { opacity: .55; }
  .overlay .best { color: #ffd34d; font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <!-- canvas is injected here and re-created on restart -->
    <div id="controls">
      <button id="pauseBtn" title="Pause" aria-label="Pause or resume">❚❚</button>
      <button id="soundBtn" title="Sound on/off" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="overlay" id="lose">
      <h1>Game Over</h1>
      <p class="loseTime">Time: 0:00</p>
      <p class="best loseBest">Best time: —</p>
      <p>The orange blob got you.</p>
      <button data-restart>Restart</button>
    </div>
    <div class="overlay" id="win">
      <h1>YOU WIN!</h1>
      <p id="winTime">Time: 0:00</p>
      <p id="winScore">Score: 0</p>
      <p class="best" id="winBest">Best time: —</p>
      <button data-restart>Play Again</button>
    </div>
    <div id="warn">⚠️ <span>Ouch! One extra life used — be careful!</span></div>
  </div>
</div>


<script>
(function () {
  const W = 960, H = 540;                 // window (viewport) size
  const SCREENS = 7;                      // 7 stitched canvases
  const WORLD_W = W * SCREENS;            // total level width
  const GROUND_H = 70;
  const GROUND_Y = H - GROUND_H;
  const GRAVITY = 0.58;
  const JUMP_V = -15.8;
  const JUMP_CUT = 0.45;
  const SPEED = 5.2;
  const AIR_SPEED = 5.8;                  // slightly faster in the air for longer hops

  const HERO_W = 48, HERO_H = 64;
  const SHRINK = 0.72;

  const heroImg = new Image();
  heroImg.src = '/hero.png';

  const stage = document.getElementById('stage');
  const loseEl = document.getElementById('lose');
  const winEl = document.getElementById('win');
  const warnEl = document.getElementById('warn');
  const winScoreEl = document.getElementById('winScore');
  const winTimeEl = document.getElementById('winTime');
  const winBestEl = document.getElementById('winBest');
  const loseTimeEl = document.querySelector('#lose .loseTime');
  const loseBestEl = document.querySelector('#lose .loseBest');
  const pauseBtn = document.getElementById('pauseBtn');
  const soundBtn = document.getElementById('soundBtn');

  let canvas, ctx, raf = null;
  let keys = {};
  let state;
  let paused = false;
  let soundOn = localStorage.getItem('rsa_sound') !== '0';


  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function fmtTime(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }

  /* ---------- best time ---------- */
  function bestMs() { const v = parseFloat(localStorage.getItem('rsa_best') || ''); return isFinite(v) ? v : null; }
  function saveBest(ms) {
    const b = bestMs();
    if (b === null || ms < b) { localStorage.setItem('rsa_best', String(Math.round(ms))); return true; }
    return false;
  }
  function bestText() { const b = bestMs(); return b === null ? 'Best time: —' : 'Best time: ' + fmtTime(b); }

  /* ---------- audio (WebAudio, no files) ---------- */
  let actx = null, master = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { actx = new AC(); master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination); }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, gain, slideTo) {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, a.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  const jumpSound = () => { tone(300, 0.16, 'square', 0.05, 720); setTimeout(() => tone(520, 0.14, 'sine', 0.05, 900), 40); };
  const hurtSound = () => { tone(420, 0.18, 'square', 0.08, 160); setTimeout(() => tone(220, 0.28, 'sawtooth', 0.07, 110), 120); };
  const coinSound = () => { tone(880, 0.09, 'triangle', 0.10); setTimeout(() => tone(1320, 0.12, 'triangle', 0.09), 70); };
  const winSound  = () => [0,120,240,420].forEach((d,i) => setTimeout(() => tone([523,659,784,1047][i], 0.25, 'triangle', 0.1), d));
  const loseSound = () => tone(320, 0.5, 'sawtooth', 0.08, 90);

  /* ---------- background music (upbeat, mellow synth-pop loop) ---------- */
  // 8-bar chord progression (Am - F - C - G style), warm pad + soft arp + light drums
  const CHORDS = [
    [220.00, 261.63, 329.63],   // Am
    [174.61, 220.00, 261.63],   // F
    [261.63, 329.63, 392.00],   // C
    [196.00, 246.94, 293.66]    // G
  ];
  const ARP_PATTERN = [0, 1, 2, 1, 2, 1, 0, 2];
  let musicTimer = null, step = 0, musicBus = null;
  function musicGain() {
    const a = audio(); if (!a) return null;
    if (!musicBus) {
      musicBus = a.createGain();
      const lp = a.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2400;
      musicBus.gain.value = 0.55;
      musicBus.connect(lp); lp.connect(master);
    }
    return musicBus;
  }
  function musicNote(freq, dur, type, gain, when) {
    const a = audio(), bus = musicGain(); if (!a || !bus) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0);
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.08, dur * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function drum(kind, when) {
    const a = audio(), bus = musicGain(); if (!a || !bus) return;
    const t = a.currentTime + (when || 0);
    if (kind === 'kick') {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.13);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.2);
    } else {
      const len = Math.floor(a.sampleRate * 0.05);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = a.createBufferSource(); src.buffer = buf;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
      const g = a.createGain(); g.gain.value = kind === 'snare' ? 0.05 : 0.025;
      src.connect(hp); hp.connect(g); g.connect(bus); src.start(t);
    }
  }
  function startMusic() {
    if (!soundOn || musicTimer) return;
    if (!audio()) return;
    const beat = 250;               // eighth-note step, ~120 BPM feel
    musicTimer = setInterval(() => {
      const bar = Math.floor(step / 8) % 4;
      const chord = CHORDS[bar];
      // warm pad on each bar
      if (step % 8 === 0) {
        chord.forEach((f, i) => musicNote(f / 2, 1.9, 'sine', 0.05 - i * 0.008));
        chord.forEach((f, i) => musicNote(f, 1.9, 'triangle', 0.028 - i * 0.005));
      }
      // gentle arpeggio sparkle
      const an = chord[ARP_PATTERN[step % ARP_PATTERN.length]] * 2;
      musicNote(an, 0.22, 'triangle', 0.030);
      // light groove
      if (step % 4 === 0) drum('kick');
      if (step % 8 === 4) drum('snare');
      if (step % 2 === 1) drum('hat');
      step++;
    }, beat);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

  // browsers require a gesture before audio starts
  ['keydown', 'pointerdown'].forEach(ev => window.addEventListener(ev, function once() {
    audio();
    if (soundOn && !paused && state && !state.over && !state.won) startMusic();
    window.removeEventListener(ev, once);
  }));


  /* ---------- level generation ---------- */
  // Platforms form one reachable chain across all 7 screens:
  // vertical steps <= 105px, horizontal gaps <= 150px (both within jump range).
  function makePlatforms() {
    const platforms = [];
    const LEVELS = [GROUND_Y - 100, GROUND_Y - 195, GROUND_Y - 290];
    let li = 0;
    let cursor = 150;
    for (let s = 0; s < SCREENS; s++) {
      const count = Math.random() < 0.5 ? 3 : 4;
      const endX = (s + 1) * W - (s === SCREENS - 1 ? 130 : 0);
      for (let i = 0; i < count; i++) {
        const w = rnd(160, 205);
        if (cursor + w > endX - 20) break;
        platforms.push({ x: cursor, y: LEVELS[li], w, h: 18 });
        cursor += w + rnd(70, 125);   // horizontal gap always inside jump range
        // step up or down by exactly one level (always reachable)
        if (li === 0) li = 1;
        else if (li === 2) li = 1;
        else li = Math.random() < 0.55 ? 2 : 0;
      }

    }
    platforms.sort((a, b) => a.x - b.x);
    return platforms;
  }


  function randomCoins(platforms) {
    const coins = [];
    const add = (x, y) => coins.push({ x, y, r: 9, got: false, t: Math.random() * Math.PI * 2 });
    for (let s = 0; s < SCREENS; s++) {
      const x0 = s * W, x1 = x0 + W;
      const onScreen = platforms.filter(p => p.x >= x0 - 40 && p.x < x1);
      let placed = 0;
      // 2 coins per platform (sitting on it)
      onScreen.forEach(p => {
        for (let k = 0; k < 2 && placed < 7; k++) {
          add(p.x + 20 + Math.random() * (p.w - 40), p.y - 24 - Math.random() * 14);
          placed++;
        }
      });
      // 2 floating coins in the air above platforms (jump to reach)
      for (let k = 0; k < 2 && onScreen.length; k++) {
        const p = pick(onScreen);
        add(p.x + 20 + Math.random() * (p.w - 40), p.y - 90 - Math.random() * 50);
        placed++;
      }
      // remaining coins on the ground
      while (placed < 10) {
        const gx = x0 + (s === 0 ? 200 : 40) + Math.random() * (W - (s === 0 ? 260 : 100));
        add(gx, GROUND_Y - 26 - Math.random() * 18);
        placed++;
      }
    }
    return coins;
  }

  function makeEnemies() {
    const enemies = [];
    for (let s = 0; s < SCREENS; s++) {
      const min = s * W + 40, max = s * W + W - (s === SCREENS - 1 ? 160 : 40);
      enemies.push({ x: rnd(min + 60, max - 60), y: GROUND_Y - 18, r: 18, vx: (Math.random() < .5 ? -1 : 1) * rnd(1.7, 2.6), min, max });
    }
    return enemies;
  }

  function makeDecor() {
    const grass = [];
    for (let i = 0; i < 90 * SCREENS; i++) {
      grass.push({ x: Math.random() * WORLD_W, h: 6 + Math.random() * 12, lean: (Math.random() - .5) * 6 });
    }
    const flowers = [];
    for (let i = 0; i < 18 * SCREENS; i++) {
      flowers.push({ x: Math.random() * WORLD_W, y: GROUND_Y + 12 + Math.random() * 34, c: ['#fff3b0','#ffd6e0','#e5d4ff'][i % 3] });
    }
    const clouds = [];
    for (let i = 0; i < 6 * SCREENS; i++) {
      clouds.push({ x: Math.random() * WORLD_W, y: 30 + Math.random() * 140, s: 0.7 + Math.random() * 0.9, v: 0.14 + Math.random() * 0.28 });
    }
    // background features: trees on some screens, bushes / hills on others
    const trees = [], bushes = [], hills = [];
    for (let s = 0; s < SCREENS; s++) {
      const kind = Math.random();
      if (kind < 0.6) {
        const n = Math.random() < 0.5 ? 1 : 2;
        for (let i = 0; i < n; i++) trees.push({ x: s * W + rnd(80, W - 80), s: rnd(0.85, 1.25) });
      }
      if (kind > 0.35) {
        for (let i = 0; i < 3; i++) bushes.push({ x: s * W + rnd(40, W - 40), s: rnd(0.7, 1.2) });
      }
      hills.push({ x: s * W + rnd(100, W - 100), s: rnd(0.9, 1.5) });
    }
    return { grass, flowers, clouds, trees, bushes, hills };
  }

  function newState() {
    const platforms = makePlatforms();
    return {
      player: {
        x: 60, y: GROUND_Y - HERO_H, w: HERO_W, h: HERO_H,
        vx: 0, vy: 0, onGround: true, face: 1,
        coyote: 8, buffer: 0, holding: false,
        scale: 1, targetScale: 1, invuln: 0, hitFx: 0
      },
      platforms,
      coins: randomCoins(platforms),
      enemies: makeEnemies(),
      flag: { x: WORLD_W - 70, y: GROUND_Y - 96, w: 6, h: 96 },
      sparkles: [],
      decor: makeDecor(),
      camX: 0,
      lives: 2,
      score: 0,
      startTime: performance.now(),
      elapsed: 0,
      over: false,
      won: false
    };
  }


  let warnTimer = null;
  function showWarning() {
    warnEl.classList.add('show');
    clearTimeout(warnTimer);
    warnTimer = setTimeout(() => warnEl.classList.remove('show'), 2200);
  }

  /* ---------- canvas creation (fresh canvas each restart, fixed size) ---------- */
  function createCanvas() {
    if (canvas) canvas.remove();
    canvas = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    stage.insertBefore(canvas, stage.firstChild);
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ---------- input ---------- */
  const isJumpKey = k => k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W';
  window.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(e.key)) e.preventDefault();
    if (e.repeat) return;
    keys[e.key] = true;
    if (isJumpKey(e.key) && state && !state.over && !state.won) {
      state.player.buffer = 9;      // buffered jump: fires as soon as landing/coyote allows
      state.player.holding = true;
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (isJumpKey(e.key) && state) {
      state.player.holding = false;
      if (state.player.vy < 0) state.player.vy *= JUMP_CUT;
    }
  });


  /* ---------- update ---------- */
  function update(dt) {
    const s = state, p = s.player;

    s.decor.clouds.forEach(c => {
      c.x += c.v * dt;
      if (c.x - 90 * c.s > WORLD_W) { c.x = -90 * c.s; c.y = 30 + Math.random() * 140; }
    });
    s.sparkles.forEach(sp => { sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 0.08 * dt; sp.life -= dt; });
    s.sparkles = s.sparkles.filter(sp => sp.life > 0);

    if (s.over || s.won) return;

    s.elapsed = performance.now() - s.startTime;

    // ---- horizontal movement with acceleration + air control ----
    let dir = 0;
    if (keys['ArrowLeft']) dir -= 1;
    if (keys['ArrowRight']) dir += 1;
    if (dir !== 0) p.face = dir;
    const accel = p.onGround ? 1.5 : 0.85;      // air control keeps momentum but stays steerable
    const friction = p.onGround ? 0.72 : 0.94;
    if (dir !== 0) {
      p.vx += dir * accel * dt;
      const max = SPEED;
      if (p.vx > max) p.vx = max;
      if (p.vx < -max) p.vx = -max;
    } else {
      p.vx *= Math.pow(friction, dt);
      if (Math.abs(p.vx) < 0.05) p.vx = 0;
    }
    p.x += p.vx * dt;
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > WORLD_W) { p.x = WORLD_W - p.w; p.vx = 0; }

    if (p.invuln > 0) p.invuln -= dt;
    if (p.hitFx > 0) p.hitFx -= dt;
    if (Math.abs(p.scale - p.targetScale) > 0.002) {
      const bottom = p.y + p.h;
      p.scale += (p.targetScale - p.scale) * 0.18 * dt;
      p.w = HERO_W * p.scale;
      p.h = HERO_H * p.scale;
      p.y = bottom - p.h;
    }

    // ---- jump: coyote time + input buffer + variable height ----
    if (p.coyote > 0) p.coyote -= dt;
    if (p.buffer > 0) p.buffer -= dt;
    if (p.buffer > 0 && p.coyote > 0) {
      p.vy = JUMP_V;
      p.onGround = false;
      p.coyote = 0;
      p.buffer = 0;
      p.holding = true;
      if (dir !== 0) p.vx = dir * SPEED;   // small horizontal boost off the ledge
      jumpSound();
    }

    // ---- vertical ----
    const prevBottom = p.y + p.h;
    const rising = p.vy < 0;
    const grav = rising && p.holding ? GRAVITY * 0.62 : (rising ? GRAVITY : GRAVITY * 1.15);
    p.vy += grav * dt;
    if (p.vy > 18) p.vy = 18;
    p.y += p.vy * dt;
    const wasOnGround = p.onGround;
    p.onGround = false;

    if (p.y < 0) { p.y = 0; p.vy = 0; }

    if (p.vy >= 0) {
      for (const pl of s.platforms) {
        const overlapX = p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2;
        if (overlapX && prevBottom <= pl.y + 1 && p.y + p.h >= pl.y) {
          p.y = pl.y - p.h; p.vy = 0; p.onGround = true;
        }
      }
    }

    if (p.y + p.h >= GROUND_Y) { p.y = GROUND_Y - p.h; p.vy = 0; p.onGround = true; }

    if (p.onGround) { p.coyote = 8; p.holding = false; }
    else if (wasOnGround) p.coyote = Math.max(p.coyote, 8);

    // ---- smooth camera (eased follow with a small dead zone) ----
    const target = Math.max(0, Math.min(WORLD_W - W, p.x + p.w / 2 + p.vx * 12 - W / 2));
    const lerp = 1 - Math.pow(1 - 0.11, dt);
    s.camX += (target - s.camX) * lerp;
    if (Math.abs(target - s.camX) < 0.3) s.camX = target;

    // ---- enemies ----
    for (const e of s.enemies) {
      e.x += e.vx * dt;
      if (e.x - e.r < e.min) { e.x = e.min + e.r; e.vx = Math.abs(e.vx); }
      if (e.x + e.r > e.max) { e.x = e.max - e.r; e.vx = -Math.abs(e.vx); }

      const cx = Math.max(p.x, Math.min(e.x, p.x + p.w));
      const cy = Math.max(p.y, Math.min(e.y, p.y + p.h));
      if (p.invuln <= 0 && (cx - e.x) ** 2 + (cy - e.y) ** 2 < e.r * e.r) {
        s.lives--;
        if (s.lives > 0) {
          p.targetScale = SHRINK;
          p.invuln = 120;
          p.hitFx = 40;
          hurtSound();
          showWarning();
          hitBurst(p.x + p.w / 2, p.y + p.h / 2);
          e.x = e.min + e.r;
          e.vx = Math.abs(e.vx);
        } else {
          s.over = true; stopMusic(); loseSound();
          loseTimeEl.textContent = 'Time: ' + fmtTime(s.elapsed);
          loseBestEl.textContent = bestText();
          loseEl.classList.add('show');
        }
        break;
      }
    }

    // coins
    for (const c of s.coins) {
      if (c.got) continue;
      c.t += 0.08 * dt;
      const ccx = Math.max(p.x, Math.min(c.x, p.x + p.w));
      const ccy = Math.max(p.y, Math.min(c.y, p.y + p.h));
      if ((ccx - c.x) ** 2 + (ccy - c.y) ** 2 < (c.r + 2) ** 2) {
        c.got = true; s.score++; coinSound(); burst(c.x, c.y);
      }
    }

    // flag (right end of the last screen)
    const f = s.flag;
    if (p.x + p.w > f.x - 8 && p.x < f.x + 40 && p.y + p.h > f.y && p.y < f.y + f.h) {
      s.won = true; stopMusic(); winSound();
      const improved = saveBest(s.elapsed);
      winTimeEl.textContent = 'Time: ' + fmtTime(s.elapsed);
      winScoreEl.textContent = 'Score: ' + s.score + ' / ' + s.coins.length;
      winBestEl.textContent = (improved ? '🏆 New best time! ' : '') + bestText();
      winEl.classList.add('show');
    }
  }


  function burst(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.6;
      state.sparkles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 26 + Math.random() * 18, max: 44,
        c: ['#fff8c9', '#ffe066', '#ffffff'][i % 3]
      });
    }
  }

  function hitBurst(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.4;
      state.sparkles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.4,
        life: 30 + Math.random() * 22, max: 52,
        c: ['#ffffff', '#ffb3a7', '#ff6b5e'][i % 3]
      });
    }
  }

  /* ---------- draw ---------- */
  const vis = (x, pad) => x > state.camX - pad && x < state.camX + W + pad;

  function draw() {
    const s = state;
    const cam = Math.round(s.camX * 2) / 2;


    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd3ff');
    sky.addColorStop(0.65, '#cfeaff');
    sky.addColorStop(1, '#eaf7ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // distant hills (parallax)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#7bc47f';
    s.decor.hills.forEach(hl => {
      const hx = hl.x - cam * 0.5;
      if (hx < -300 || hx > W + 300) return;
      ctx.beginPath();
      ctx.ellipse(hx, GROUND_Y + 6, 190 * hl.s, 90 * hl.s, 0, Math.PI, 0);
      ctx.fill();
    });
    ctx.restore();

    // faded clouds
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    s.decor.clouds.forEach(c => {
      const k = c.s, cx = c.x - cam * 0.6;
      if (cx < -160 || cx > W + 160) return;
      ctx.beginPath();
      ctx.ellipse(cx, c.y, 46 * k, 20 * k, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 34 * k, c.y + 6 * k, 32 * k, 16 * k, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 34 * k, c.y + 8 * k, 28 * k, 14 * k, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 8 * k, c.y - 14 * k, 26 * k, 18 * k, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // trees
    s.decor.trees.forEach(t => {
      const tx = t.x - cam;
      if (tx < -140 || tx > W + 140) return;
      const k = t.s;
      ctx.fillStyle = '#6b4a2b';
      ctx.fillRect(tx - 7 * k, GROUND_Y - 82 * k, 14 * k, 84 * k);
      ctx.fillStyle = '#3f9e57';
      ctx.beginPath();
      ctx.arc(tx, GROUND_Y - 96 * k, 40 * k, 0, Math.PI * 2);
      ctx.arc(tx - 32 * k, GROUND_Y - 74 * k, 28 * k, 0, Math.PI * 2);
      ctx.arc(tx + 32 * k, GROUND_Y - 74 * k, 28 * k, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.arc(tx - 12 * k, GROUND_Y - 108 * k, 16 * k, 0, Math.PI * 2); ctx.fill();
    });

    // bushes
    s.decor.bushes.forEach(b => {
      const bx = b.x - cam;
      if (bx < -100 || bx > W + 100) return;
      const k = b.s;
      ctx.fillStyle = '#49a85f';
      ctx.beginPath();
      ctx.arc(bx, GROUND_Y - 6 * k, 20 * k, 0, Math.PI * 2);
      ctx.arc(bx - 18 * k, GROUND_Y - 2 * k, 15 * k, 0, Math.PI * 2);
      ctx.arc(bx + 18 * k, GROUND_Y - 2 * k, 15 * k, 0, Math.PI * 2);
      ctx.fill();
    });

    // ground
    const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    g.addColorStop(0, '#4caf50');
    g.addColorStop(1, '#2e7d32');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(0, GROUND_Y, W, 5);

    // faded grass blades
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#dcffd6';
    ctx.lineWidth = 2;
    s.decor.grass.forEach(b => {
      const bx = b.x - cam;
      if (bx < -20 || bx > W + 20) return;
      ctx.beginPath();
      ctx.moveTo(bx, GROUND_Y + 2);
      ctx.quadraticCurveTo(bx + b.lean, GROUND_Y - b.h / 2, bx + b.lean * 1.6, GROUND_Y - b.h);
      ctx.stroke();
    });
    // faded flowers
    s.decor.flowers.forEach(f => {
      const fx = f.x - cam;
      if (fx < -20 || fx > W + 20) return;
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = f.c;
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(fx + Math.cos(a) * 4, f.y + Math.sin(a) * 4, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#fff6c2';
      ctx.beginPath(); ctx.arc(fx, f.y, 2, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // platforms (brown)
    s.platforms.forEach(p => {
      const px = p.x - cam;
      if (px < -p.w - 20 || px > W + 20) return;
      ctx.fillStyle = '#6d4423';
      ctx.fillRect(px, p.y, p.w, p.h);
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(px, p.y, p.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.fillRect(px, p.y + p.h - 4, p.w, 4);
    });

    // flag
    const f = s.flag, fx = f.x - cam;
    if (fx > -80 && fx < W + 80) {
      ctx.fillStyle = '#7a6a3a';
      ctx.fillRect(fx, f.y, f.w, f.h);
      const fg = ctx.createLinearGradient(fx, f.y, fx + 44, f.y + 30);
      fg.addColorStop(0, '#ffe680'); fg.addColorStop(1, '#e0a800');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(fx + f.w, f.y + 4);
      ctx.lineTo(fx + f.w + 46, f.y + 19);
      ctx.lineTo(fx + f.w, f.y + 34);
      ctx.closePath();
      ctx.fill();
    }

    // coins
    s.coins.forEach(c => {
      if (c.got) return;
      const cx = c.x - cam;
      if (cx < -20 || cx > W + 20) return;
      const sq = Math.abs(Math.cos(c.t));
      ctx.fillStyle = '#ffd633';
      ctx.beginPath();
      ctx.ellipse(cx, c.y, Math.max(2.5, c.r * sq), c.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c9a100'; ctx.lineWidth = 1.5; ctx.stroke();
    });

    // enemies
    s.enemies.forEach(e => {
      const ex = e.x - cam;
      if (ex < -60 || ex > W + 60) return;
      ctx.fillStyle = '#ff8c1a';
      ctx.beginPath(); ctx.arc(ex, e.y, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - 6, e.y - 4, 4, 0, Math.PI * 2); ctx.arc(ex + 6, e.y - 4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#332200';
      const look = e.vx > 0 ? 1.6 : -1.6;
      ctx.beginPath(); ctx.arc(ex - 6 + look, e.y - 4, 1.8, 0, Math.PI * 2); ctx.arc(ex + 6 + look, e.y - 4, 1.8, 0, Math.PI * 2); ctx.fill();
    });

    // player (sprite)
    const p = s.player;
    const pxs = p.x - cam;
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(pxs + p.w / 2, p.y + p.h + 3, p.w / 2, 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    if (p.invuln > 0 && Math.floor(p.invuln / 5) % 2 === 0) ctx.globalAlpha = 0.45;
    const pop = p.hitFx > 0 ? 1 + Math.sin(p.hitFx / 40 * Math.PI) * 0.12 : 1;
    const dw = p.w * pop, dh = p.h * pop;
    const dx = pxs + (p.w - dw) / 2, dy = p.y + (p.h - dh);
    ctx.imageSmoothingEnabled = false;
    if (heroImg.complete && heroImg.naturalWidth) {
      if (p.face < 0) {
        ctx.translate(dx + dw / 2, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(heroImg, -dw / 2, dy, dw, dh);
      } else {
        ctx.drawImage(heroImg, dx, dy, dw, dh);
      }
    } else {
      ctx.fillStyle = '#e63946';
      ctx.fillRect(dx, dy, dw, dh);
    }
    ctx.restore();

    // sparkles
    s.sparkles.forEach(sp => {
      ctx.globalAlpha = Math.max(0, sp.life / sp.max);
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(sp.x - cam, sp.y, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    // HUD — score
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.roundRect(16, 16, 150, 42, 12); ctx.fill();
    ctx.fillStyle = '#ffd633';
    ctx.beginPath(); ctx.arc(40, 37, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + s.score, 58, 38);

    // HUD — lives
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.roundRect(180, 16, 108, 42, 12); ctx.fill();
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Lives', 196, 38);
    for (let i = 0; i < 2; i++) {
      ctx.fillStyle = i < s.lives ? '#ff5e5e' : 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(248 + i * 22, 37, 8, 0, Math.PI * 2); ctx.fill();
    }

    // HUD — timer (top right)
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.roundRect(W - 132, 16, 116, 36, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('⏱ ' + fmtTime(s.elapsed), W - 28, 35);
    ctx.textAlign = 'left';

    if (paused) {
      ctx.fillStyle = 'rgba(10,16,24,.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', W / 2, H / 2);
      ctx.textAlign = 'left';
    }
  }

  let lastT = 0;
  function loop(t) {
    const dt = lastT ? Math.min(2.2, (t - lastT) / 16.6667) : 1;
    lastT = t;
    if (!paused) update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (raf) cancelAnimationFrame(raf);
    keys = {};
    lastT = 0;
    setPaused(false);
    loseEl.classList.remove('show');
    winEl.classList.remove('show');
    clearTimeout(warnTimer);
    warnEl.classList.remove('show');
    createCanvas();
    state = newState();
    raf = requestAnimationFrame(loop);
  }

  /* ---------- pause / sound controls ---------- */
  function setPaused(v) {
    paused = v;
    pauseBtn.textContent = v ? '▶' : '❚❚';
    pauseBtn.title = v ? 'Resume' : 'Pause';
    if (state && !v) state.startTime = performance.now() - state.elapsed;
    if (v) stopMusic(); else if (soundOn && state && !state.over && !state.won) startMusic();
  }
  pauseBtn.addEventListener('click', () => { if (state && !state.over && !state.won) setPaused(!paused); pauseBtn.blur(); });
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem('rsa_sound', soundOn ? '1' : '0');
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !soundOn);
    if (soundOn && !paused) startMusic(); else stopMusic();
    soundBtn.blur();
  });
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !soundOn);

  window.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P') { if (state && !state.over && !state.won) setPaused(!paused); }
    if (e.key === 'm' || e.key === 'M') soundBtn.click();
  });

  document.querySelectorAll('[data-restart]').forEach(b => b.addEventListener('click', () => { start(); b.blur(); }));

  start();

})();
</script>
</body>
</html>
